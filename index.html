<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redline</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      label { display: block; margin: 1rem 0; font-weight: 600; }
      input[type='file'] { display: block; margin-top: 0.25rem; font-weight: 400; }
      button { font: inherit; padding: 0.5rem 1.25rem; }
      #status[data-state='error'], #status[data-state='withheld'] { color: #b00020; }
      #report li[data-passed='true']::before { content: '\2713  '; color: #0a7a2f; }
      #report li[data-passed='false']::before { content: '\2717  '; color: #b00020; }
      #report { list-style: none; padding: 0; }
      #report .failure { white-space: pre-wrap; margin: 0.25rem 0 0.75rem 1.5rem; color: #b00020; }
      a[hidden] { display: none; }
      a { display: block; margin: 0.5rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Redline</h1>
      <p>Development page. The comparison runs in your browser; the files are not uploaded.</p>
      <label>Original <input id="original" type="file" accept=".docx" /></label>
      <label>Modified <input id="modified" type="file" accept=".docx" /></label>
      <button id="compare" type="button" disabled>Compare</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="report" aria-label="Check report" hidden></ul>
      <a id="download" download="redline-tracked-changes.docx" hidden>Download Word file (tracked changes)</a>
      <a id="report-download" download="redline-check-report.txt" hidden>Download check report</a>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
